name: Build and Deploy

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build site
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_TEXTS: ${{ secrets.NOTION_DB_TEXTS }}
          NOTION_DB_PREDIMSTVA: ${{ secrets.NOTION_DB_PREDIMSTVA }}
          NOTION_DB_USLUGI: ${{ secrets.NOTION_DB_USLUGI }}
          NOTION_DB_OTZIVI: ${{ secrets.NOTION_DB_OTZIVI }}
          NOTION_DB_GALERIA: ${{ secrets.NOTION_DB_GALERIA }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
